  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preload" href="/assets/fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin />

<!-- THE MOCK VERSION of writing/aot.html: the same page, with made-up arcs (assets/aot/mock-connections.json) to
     judge the layout by. Keep it in step with aot.html; delete it once the real one has enough arcs.
     The Attack on Titan piece (assets/post/post.css for the night page): for now just the arc diagram (src/arcs.js).
     The contents rail on the left is built from the h2s (src/post.js); the diagram's heading is hidden on the page
     itself and shows only in the rail. The writing comes later. -->
<body class="piece-page post-page">

  <nav class="rail" aria-label="On this page">
    <a class="rail-back" href="/writing">back to thoughts</a>
    <div class="rail-track">
      <span class="rail-line" aria-hidden="true"></span>
      <span class="rail-fill" aria-hidden="true"></span>
      <ol class="rail-list"></ol>
    </div>
  </nav>

  <!-- only shown on this computer (src/arcs.js): flip between the real diagram and the one full of mock arcs -->
  <nav class="dev-switch" aria-label="Preview" hidden>
    <a href="/writing/aot">real</a><a href="/writing/aot-mock" aria-current="page">mock</a>
  </nav>

  <main class="post">
    <!-- (narrow screens only: on wide ones the rail carries the way back) -->
    <a class="back post-back" href="/writing">back to thoughts</a>

    <article class="post-body">
      <h2 id="the-arcs" class="rail-only">the arcs</h2>
      <!-- the arc diagram (src/arcs.js) -->
      <figure class="arcs" id="arcs" data-mock>
        <div class="arc-key" aria-label="Key: short low arcs join moments close together, tall gold arcs join moments far apart"></div>
        <div class="chart"></div>
        <div class="arc-tip" hidden></div>
        <div class="arc-card" aria-live="polite" hidden></div>
      </figure>
    </article>
  </main>

  <script type="module" src="/build/arcs.js"></script>
  <script type="module" src="/build/post.js"></script>
</body>
</html>

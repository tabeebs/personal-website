<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tabeebs</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <!-- the tab bar lens's refraction; src/tabs.js draws the map for the lens's size -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <filter id="lens-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage id="lens-map" x="0" y="0" width="1" height="1" preserveAspectRatio="none" result="map"/>
      <feDisplacementMap id="lens-disp" in="SourceGraphic" in2="map" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main id="content">
    <!-- the hush: blurs everything behind it while "the web" is open (src/web.js) -->
    <div class="hush" aria-hidden="true"></div>
    <div class="panel">
      <!-- Frosted glass tabs, top right of the panel (src/tabs.js). The selected tab sits under a clear lens you can
           click or drag between them; hovering a tab says where it goes. -->
      <nav class="tabs" role="tablist" aria-label="Sections">
        <span class="lens" aria-hidden="true"><span class="lens-body"></span></span>
        <button class="tab" type="button" role="tab" id="tab-home" aria-controls="view-home" aria-selected="true" aria-label="Home" data-view="home" data-tint="#fbe6ae">
          <span class="doodle" data-doodle="house" data-size="30" aria-hidden="true"></span>
        </button>
        <button class="tab" type="button" role="tab" id="tab-experience" aria-controls="view-experience" aria-selected="false" aria-label="Experience" tabindex="-1" data-view="experience" data-tint="#f9d0c5">
          <span class="doodle" data-doodle="briefcase" data-size="30" aria-hidden="true"></span>
        </button>
      </nav>
      <span class="tip" aria-hidden="true"><span class="tip-text"></span></span>

      <div class="views">
        <section class="view" id="view-home" role="tabpanel" aria-labelledby="tab-home">
          <section class="intro">
            <h1 class="hi" data-meaning="māori: hello!">kia ora!</h1>
            <!-- clicking "shaf" copies my email address (src/contact.js) -->
            <p>i'm <span class="name" data-copy-email role="button" tabindex="0" aria-label="shaf: copy my email address">shaf</span>, a CS student @ UNSW.</p>
            <!-- "the web" (src/web.js): hovering or focusing it hushes the rest of the page behind a blur and pops my
                 profiles up above it; their sizes follow the pointer like a dock: the one under it swells, the others shrink back -->
            <p>welcome to my little corner of <span class="web"><button class="web-btn" type="button" aria-expanded="false" aria-controls="socials"><span class="doodle" data-doodle="globe" data-size="19" data-hover=".web" data-quick aria-hidden="true"></span><span class="web-label">the web</span></button><span class="socials" id="socials" role="group" aria-label="Find me on"><a class="social" href="https://github.com/tabeebs" target="_blank" rel="noopener" aria-label="GitHub" data-tint="#dcd6f7"><span class="social-tip" aria-hidden="true">GitHub</span><span class="doodle" data-doodle="github" data-size="76" data-hover=".social" data-quick aria-hidden="true"></span></a><a class="social" href="https://www.linkedin.com/in/tabeebs/" target="_blank" rel="noopener" aria-label="LinkedIn" data-tint="#d3e2f7"><span class="social-tip" aria-hidden="true">LinkedIn</span><span class="doodle" data-doodle="linkedin" data-size="76" data-hover=".social" data-quick aria-hidden="true"></span></a></span></span>.</p>
          </section>

          <section class="collections" aria-label="Links">
            <p class="cv piece">CV on request</p>
          </section>
        </section>

        <!-- placeholder until the experience section is written -->
        <section class="view" id="view-experience" role="tabpanel" aria-labelledby="tab-experience" hidden>
          <section class="intro">
            <h2 class="hi">experience</h2>
            <p class="soon">more on this soon.</p>
          </section>
        </section>
      </div>
    </div>
  </main>

  <canvas id="ground" aria-hidden="true"></canvas>

  <script type="module" src="/build/sky.js"></script>
  <script type="module" src="/build/doodles.js"></script>
  <script type="module" src="/build/favicon.js"></script>
  <script type="module" src="/build/tabs.js"></script>
  <script type="module" src="/build/hello.js"></script>
  <script type="module" src="/build/contact.js"></script>
  <script type="module" src="/build/web.js"></script>
</body>
</html>

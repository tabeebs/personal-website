<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tabeebs</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/build/intro.js"></script>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>

  <main id="content">
    <!-- the hush: blurs everything behind it while "the web" is open (src/web.js) -->
    <div class="hush" aria-hidden="true"></div>
    <div class="panel">
      <section class="view" id="view-home">
        <section class="intro">
          <h1 class="hi" data-meaning="māori: hello!">kia ora!</h1>
          <!-- clicking "shaf" copies my email address (src/contact.js) -->
          <p>i'm <span class="name" data-copy-email role="button" tabindex="0" aria-label="shaf: copy my email address">shaf</span>, a CS student @ UNSW.</p>
          <!-- "the web" (src/web.js): hovering or focusing it hushes the rest of the page behind a blur and pops my
               profiles up above it; their sizes follow the pointer like a dock: the one under it swells, the others shrink back -->
          <p>welcome to my little corner of <span class="web"><button class="web-btn" type="button" aria-expanded="false" aria-controls="socials"><span class="doodle" data-doodle="globe" data-size="19" data-hover=".web" data-quick aria-hidden="true"></span><span class="web-label">the web</span></button><span class="socials" id="socials" role="group" aria-label="Find me on"><a class="social" href="https://github.com/tabeebs" target="_blank" rel="noopener" aria-label="GitHub" data-tint="#dcd6f7"><span class="social-tip" aria-hidden="true">GitHub</span><span class="doodle" data-doodle="github" data-size="76" data-hover=".social" data-quick aria-hidden="true"></span></a><a class="social" href="https://www.linkedin.com/in/tabeebs/" target="_blank" rel="noopener" aria-label="LinkedIn" data-tint="#d3e2f7"><span class="social-tip" aria-hidden="true">LinkedIn</span><span class="doodle" data-doodle="linkedin" data-size="76" data-hover=".social" data-quick aria-hidden="true"></span></a></span></span>.</p>
        </section>

        <section class="collections" aria-label="Links">
          <p class="cv piece">CV on request</p>
        </section>
      </section>
    </div>
  </main>

  <canvas id="ground" aria-hidden="true"></canvas>

  <script type="module" src="/build/sky.js"></script>
  <script type="module" src="/build/doodles.js"></script>
  <script type="module" src="/build/favicon.js"></script>
  <script type="module" src="/build/hello.js"></script>
  <script type="module" src="/build/contact.js"></script>
  <script type="module" src="/build/web.js"></script>
</body>
</html>
